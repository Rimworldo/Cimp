<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Balls Overlay</title>

<!--
=====================================================================
 CHAT BALLS OVERLAY  -  bolas 3D controladas pelo chat da live
=====================================================================

 COMO TESTAR
 1) Sem chat (teste rápido):   index.html?demo=1
    Cria usuários falsos que mandam mensagens e comandos wasd.

 2) Twitch (padrão, canal "daenil"):
    index.html?platform=twitch&channel=daenil
    - Não precisa de login: o chat é lido de forma anônima via IRC/WebSocket.
    - Foto de perfil: por padrão usa decapi.me (sem chave). Se quiser usar
      a API oficial (Helix), passe &clientId=SEU_CLIENT_ID&token=SEU_TOKEN.

 3) YouTube:
    index.html?platform=youtube&videoId=ID_DA_LIVE&apiKey=SUA_API_KEY
    - Usa YouTube Data API v3 (videos.list + liveChatMessages.list).
    - Para lives públicas, a API KEY basta (OAuth só é necessário para
      ENVIAR mensagens ou ler chats restritos).
    - Opcional: &liveChatId=... pula a consulta do videoId.
    - Atenção à cota diária da API: o polling consome unidades.

 SERVIDOR LOCAL (necessário para fetch/WebSocket funcionarem bem):
    python3 -m http.server 8000      ->  http://localhost:8000/index.html?demo=1

 NO OBS: Fontes > Navegador > URL (ou arquivo local) com a query acima,
 largura/altura iguais ao canvas da cena. O fundo é transparente.

 EMOTES
   Emotes do 7TV (globais + do canal) e emotes nativos da Twitch aparecem
   nos pop-ups automaticamente (a API do 7TV não precisa de chave).

 OUTROS PARÂMETROS (opcionais)
   &volume=0.12      volume dos sons de colisão (0 a 1)
   &popupMs=5000     tempo que o pop-up fica na tela
   &ttlMin=30        minutos sem falar até a bola sumir (0 = nunca)
   &max=120          máximo de bolas na tela
   &roll=0           desliga a rolagem (a bola só desliza e inclina); padrão: rola
   &ignore=a,b,c     usuários ignorados (bots)
=====================================================================
-->

<style>
  :root { --u: 1; }

  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: transparent !important;   /* fundo transparente p/ overlay */
  }

  #game {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block;
    background: transparent;
  }

  /* Camada de pop-ups sobre o canvas */
  #ui {
    position: fixed; inset: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .label {
    position: absolute; left: 0; top: 0;
    display: flex; flex-direction: column; align-items: center;
    gap: calc(var(--u) * 4px);
    will-change: transform;
    pointer-events: none;
    visibility: hidden;
  }

  .bubble {
    max-width: calc(var(--u) * 260px);
    padding: calc(var(--u) * 6px) calc(var(--u) * 11px);
    border-radius: calc(var(--u) * 12px);
    background: rgba(255, 255, 255, .96);
    color: #15151a;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    font-weight: 600;
    font-size: calc(var(--u) * 16px);
    line-height: 1.25;
    text-align: center;
    overflow-wrap: anywhere;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .35);
    animation: pop .18s ease-out;
    transition: opacity .4s ease, transform .4s ease;
  }
  .bubble.out { opacity: 0; transform: translateY(-6px); }

  .emote {
    height: calc(var(--u) * 28px);
    width: auto;
    vertical-align: middle;
    margin: 0 calc(var(--u) * 3px);
  }

  @keyframes pop {
    from { opacity: 0; transform: scale(.6); }
    to   { opacity: 1; transform: scale(1); }
  }
</style>
</head>

<body>
<canvas id="game"></canvas>
<div id="ui"></div>

<!-- Three.js (CDN). Para uso offline, baixe o arquivo e aponte para ele. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(() => {
'use strict';

if (typeof THREE === 'undefined') {
  console.error('[overlay] Three.js não carregou. Verifique a conexão ou o link do CDN.');
  return;
}

/* =====================================================================
 * 1. CONFIGURAÇÃO (valores padrão, sobrescritos pela query da URL)
 * ===================================================================== */
const params = new URLSearchParams(location.search);
const P = (k, d) => params.has(k) ? params.get(k) : d;

const CONFIG = {
  platform:        P('platform', 'twitch'),           // 'twitch' | 'youtube'
  channel:         P('channel', 'daenil').toLowerCase().replace(/^#/, ''),
  twitchClientId:  P('clientId', ''),
  twitchToken:     P('token', ''),
  youtubeApiKey:   P('apiKey', 'YOUR_API_KEY'),
  youtubeVideoId:  P('videoId', 'YOUR_VIDEO_ID'),
  youtubeChatId:   P('liveChatId', ''),
  demo:            P('demo', '0') === '1',
  volume:          Math.min(1, Math.max(0, parseFloat(P('volume', '0.12')) || 0)),
  popupMs:         +P('popupMs', 5000),
  ttlMin:          +P('ttlMin', 30),
  maxBalls:        +P('max', 120),
  roll:            P('roll', '1') !== '0',
  ignore:          P('ignore', 'nightbot,streamelements,streamlabs,moobot,fossabot,wizebot')
                     .toLowerCase().split(',').map(s => s.trim()).filter(Boolean)
};

// Física (valores em "unidades de tela": multiplicados por `unit`, que
// escala com o tamanho da janela, assim o jogo se comporta igual em qualquer resolução)
const PHYS = {
  accel:       1400,   // aceleração aplicada por um comando (px/s² por unidade)
  stepSec:     0.28,   // quanto tempo cada letra (w/a/s/d) empurra a bola
  drag:        1.6,    // arrasto: v *= exp(-drag*dt)  (atrito)
  wallRest:    0.72,   // restituição nas bordas
  ballRest:    0.82,   // restituição entre bolas
  maxQueue:    40,     // máximo de letras na fila por usuário
  hitMinSpeed: 45      // velocidade mínima para tocar som de colisão
};

/* =====================================================================
 * 2. CENA THREE.JS (câmera top-down ortográfica, fundo transparente)
 * ===================================================================== */
const canvas = document.getElementById('game');
const ui = document.getElementById('ui');

const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, premultipliedAlpha: true });
renderer.setClearColor(0x000000, 0);            // alpha = 0 -> transparente
renderer.outputEncoding = THREE.sRGBEncoding;

const scene = new THREE.Scene();

// Câmera olhando de cima para baixo (eixo -Z). 1 unidade do mundo = 1 pixel.
// Mundo: x -> direita, y_mundo = -y_tela.
const camera = new THREE.OrthographicCamera(0, 1, 0, -1, 1, 3000);
camera.position.set(0, 0, 1500);

scene.add(new THREE.AmbientLight(0xffffff, 0.65));
const sun = new THREE.DirectionalLight(0xffffff, 0.5);
sun.position.set(-0.5, 0.7, 1);
scene.add(sun);

// Geometria compartilhada (esfera de raio 1). Giramos para que o CENTRO da
// foto (u = 0.25 na UV padrão) fique voltado para a câmera (+Z).
const sphereGeo = new THREE.SphereGeometry(1, 40, 28);
sphereGeo.rotateY(-Math.PI / 2);

const texLoader = new THREE.TextureLoader();
texLoader.setCrossOrigin('anonymous');

/* =====================================================================
 * 3. ESTADO E RESPONSIVIDADE
 * ===================================================================== */
let W = 0, H = 0;      // tamanho da janela
let unit = 1;          // fator de escala (min(W,H)/1000)
let R = 40;            // raio das bolas em pixels

const balls = [];                  // lista (iteração rápida na física)
const ballsById = new Map();       // id do usuário -> bola

const clamp = (v, lo, hi) => hi < lo ? (lo + hi) / 2 : (v < lo ? lo : (v > hi ? hi : v));

function clampInside(b) {
  b.x = clamp(b.x, R, W - R);
  b.y = clamp(b.y, R, H - R);
}

function resize() {
  const nw = window.innerWidth, nh = window.innerHeight;
  const oldW = W, oldH = H, oldUnit = unit;

  W = nw; H = nh;
  unit = Math.max(0.45, Math.min(W, H) / 1000);
  R = clamp(unit * 52, 18, 90);

  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(W, H, false);
  camera.left = 0; camera.right = W; camera.top = 0; camera.bottom = -H;
  camera.updateProjectionMatrix();
  document.documentElement.style.setProperty('--u', unit.toFixed(3));

  // Reposiciona as bolas proporcionalmente ao novo tamanho
  if (oldW > 0 && oldH > 0) {
    const sx = W / oldW, sy = H / oldH, su = unit / oldUnit;
    for (let i = 0; i < balls.length; i++) {
      const b = balls[i];
      b.x *= sx; b.y *= sy;
      b.vx *= su; b.vy *= su;
      clampInside(b);
    }
  }
}
window.addEventListener('resize', resize);

/* =====================================================================
 * 4. ÁUDIO (Web Audio API, sons sintetizados, volume via GainNode)
 * ===================================================================== */
let actx = null, master = null, lastHitTime = 0;

function initAudio() {
  if (actx) return;
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain();
    master.gain.value = CONFIG.volume;
    master.connect(actx.destination);
  } catch (e) {
    console.warn('[overlay] Áudio indisponível:', e);
  }
}
// Navegadores exigem um gesto do usuário para liberar o áudio (no OBS costuma funcionar direto)
['pointerdown', 'keydown', 'click'].forEach(ev =>
  window.addEventListener(ev, () => {
    initAudio();
    if (actx && actx.state === 'suspended') actx.resume();
  }, { passive: true })
);
initAudio();

function playHit(speed) {
  if (!actx || !master) return;
  if (actx.state === 'suspended') { actx.resume(); return; }
  const t = actx.currentTime;
  if (t - lastHitTime < 0.03) return;            // evita rajadas de som
  lastHitTime = t;

  const intensity = clamp(speed / (1200 * unit), 0.15, 1);
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  const f = 140 + Math.random() * 80 + intensity * 100;

  osc.type = 'sine';
  osc.frequency.setValueAtTime(f, t);
  osc.frequency.exponentialRampToValueAtTime(f * 0.5, t + 0.12);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(intensity, t + 0.005);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);

  osc.connect(gain);
  gain.connect(master);
  osc.start(t);
  osc.stop(t + 0.16);
}

/* =====================================================================
 * 5. TEXTURAS (foto de perfil + fallback gerado)
 * ===================================================================== */
function colorFromName(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
  return `hsl(${h}, 65%, 50%)`;
}

function makeFallbackCanvas(name, color) {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = color || colorFromName(name);
  g.fillRect(0, 0, 256, 256);
  g.fillStyle = 'rgba(255,255,255,.92)';
  g.font = 'bold 150px "Segoe UI", system-ui, sans-serif';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText((name[0] || '?').toUpperCase(), 128, 140);
  return c;
}

// Mapeia a foto no hemisfério voltado para a câmera: repeat.x = 2
function prepTexture(t) {
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = 4;
  t.repeat.set(2, 1);
  t.wrapS = THREE.MirroredRepeatWrapping;       // atrás da bola a foto aparece espelhada
  t.needsUpdate = true;
  return t;
}

function setBallTexture(b, tex) {
  if (!b.mesh) return;                           // bola já removida
  if (b.mesh.material.map) b.mesh.material.map.dispose();
  b.mesh.material.map = tex;
  b.mesh.material.needsUpdate = true;
}

function loadAvatar(b, url) {
  if (!url) return;
  texLoader.load(
    url,
    tex => setBallTexture(b, prepTexture(tex)),
    undefined,
    () => console.warn('[overlay] Não foi possível carregar a foto de', b.name)
  );
}

/* =====================================================================
 * 6. BOLAS (criação, remoção, pop-ups)
 * ===================================================================== */
// user = { id, name, color?, avatarUrl?, resolveAvatar?: () => Promise<string|null> }
function ensureBall(user) {
  let b = ballsById.get(user.id);
  if (b) return b;

  const material = new THREE.MeshStandardMaterial({
    map: prepTexture(new THREE.CanvasTexture(makeFallbackCanvas(user.name, user.color))),
    roughness: 0.45,
    metalness: 0.0
  });
  const mesh = new THREE.Mesh(sphereGeo, material);
  mesh.scale.setScalar(0.001);
  scene.add(mesh);

  b = {
    id: user.id, name: user.name, mesh,
    x: R + Math.random() * Math.max(1, W - 2 * R),
    y: R + Math.random() * Math.max(1, H - 2 * R),
    vx: 0, vy: 0,
    dx: 0, dy: 0, pushT: 0, queue: [],
    age: 0, lastActive: performance.now(),
    label: null, labelW: 0, labelH: 0, lastLX: 0, lastLY: 0, labelDirty: true
  };
  balls.push(b);
  ballsById.set(b.id, b);

  if (user.avatarUrl) {
    loadAvatar(b, user.avatarUrl);
  } else if (user.resolveAvatar) {
    user.resolveAvatar().then(url => loadAvatar(b, url)).catch(() => {});
  }

  if (balls.length > CONFIG.maxBalls) pruneBalls();
  return b;
}

function removeBall(b) {
  const i = balls.indexOf(b);
  if (i >= 0) balls.splice(i, 1);
  ballsById.delete(b.id);
  scene.remove(b.mesh);
  if (b.mesh.material.map) b.mesh.material.map.dispose();
  b.mesh.material.dispose();
  b.mesh = null;
  if (b.label) b.label.remove();
}

function pruneBalls() {
  // Remove as mais antigas (menos ativas) quando passa do limite
  while (balls.length > CONFIG.maxBalls) {
    let oldest = balls[0];
    for (let i = 1; i < balls.length; i++) if (balls[i].lastActive < oldest.lastActive) oldest = balls[i];
    removeBall(oldest);
  }
}

setInterval(() => {
  if (CONFIG.ttlMin <= 0) return;
  const limit = performance.now() - CONFIG.ttlMin * 60000;
  for (let i = balls.length - 1; i >= 0; i--) if (balls[i].lastActive < limit) removeBall(balls[i]);
}, 10000);

/* ---- Emotes 7TV (globais + do canal) ---- */
const emotes = new Map();          // nome do emote -> URL da imagem
let emoteNames = [];               // lista de nomes (usada no modo demo)

function addSevenTvSet(set) {
  const list = (set && set.emotes) || [];
  for (const e of list) {
    const host = e && e.data && e.data.host;
    if (!host || !host.url || !e.name) continue;
    const base = host.url.startsWith('//') ? 'https:' + host.url : host.url;
    emotes.set(e.name, base + '/2x.webp');         // webp (animado quando o emote é animado)
  }
  emoteNames = Array.from(emotes.keys());
}

async function loadSevenTvGlobal() {
  try {
    const r = await fetch('https://7tv.io/v3/emote-sets/global');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    addSevenTvSet(await r.json());
    console.log('[overlay] Emotes globais do 7TV carregados.');
  } catch (e) {
    console.warn('[overlay] Falha ao carregar emotes globais do 7TV:', e.message || e);
  }
}

let sevenTvChannelFor = null;
async function loadSevenTvChannel(twitchId) {
  if (!twitchId || sevenTvChannelFor === twitchId) return;
  sevenTvChannelFor = twitchId;
  try {
    const r = await fetch('https://7tv.io/v3/users/twitch/' + encodeURIComponent(twitchId));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    addSevenTvSet(j.emote_set);                    // emotes do canal sobrescrevem os globais
    console.log('[overlay] Emotes do canal no 7TV carregados.');
  } catch (e) {
    console.warn('[overlay] Falha ao carregar emotes do canal no 7TV:', e.message || e);
    setTimeout(() => { sevenTvChannelFor = null; }, 60000);   // tenta de novo mais tarde
  }
}

/* ---- Pop-ups ---- */
function measureLabel(b) {
  b.labelW = b.label.offsetWidth;
  b.labelH = b.label.offsetHeight;
  b.labelDirty = true;                            // força reposicionamento
}

// Posiciona o pop-up logo acima da bola (coordenadas de tela = coordenadas do mundo)
function positionLabel(b) {
  const lx = clamp(b.x, b.labelW / 2, W - b.labelW / 2);
  const ly = Math.max(b.labelH, b.y - R * 1.05);
  if (b.labelDirty || Math.abs(lx - b.lastLX) > 0.05 || Math.abs(ly - b.lastLY) > 0.05) {
    b.label.style.transform = 'translate3d(' + lx.toFixed(1) + 'px,' + ly.toFixed(1) + 'px,0) translate(-50%,-100%)';
    b.lastLX = lx; b.lastLY = ly; b.labelDirty = false;
  }
}

function makeEmoteImg(b, url, name) {
  const img = document.createElement('img');
  img.className = 'emote';
  img.alt = name;
  img.decoding = 'async';
  img.onload = () => { if (b.label) measureLabel(b); };
  img.onerror = () => {                            // se a imagem falhar, mostra o nome do emote
    img.replaceWith(document.createTextNode(name));
    if (b.label) measureLabel(b);
  };
  img.src = url;
  return img;
}

// Monta o conteúdo do balão: texto como textNode (seguro) + emotes como <img>
function fillBubble(b, bubble, text, local) {
  let buf = [], images = 0;
  const flush = () => {
    if (buf.length) { bubble.appendChild(document.createTextNode(buf.join(' '))); buf = []; }
  };
  for (const w of text.split(' ')) {
    const url = (local && local.get(w)) || emotes.get(w);
    if (url && images < 12) {
      flush();
      bubble.appendChild(makeEmoteImg(b, url, w));
      images++;
    } else {
      buf.push(w);
    }
  }
  flush();
}

function showPopup(b, text, local) {
  if (!b.label) {
    b.label = document.createElement('div');
    b.label.className = 'label';
    ui.appendChild(b.label);
  }

  let clean = text;
  if (clean.length > 160) {
    clean = clean.slice(0, 160);
    const i = clean.lastIndexOf(' ');
    if (i > 80) clean = clean.slice(0, i);
    clean += '…';
  }

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  fillBubble(b, bubble, clean, local);
  b.label.appendChild(bubble);
  b.label.style.visibility = 'visible';

  while (b.label.children.length > 3) b.label.firstChild.remove();
  measureLabel(b);
  positionLabel(b);                                // já nasce no lugar certo (sem piscar no canto)

  setTimeout(() => {
    bubble.classList.add('out');
    setTimeout(() => {
      bubble.remove();
      if (b.label) {
        if (!b.label.children.length) b.label.style.visibility = 'hidden';
        else measureLabel(b);
      }
    }, 420);
  }, CONFIG.popupMs);
}

/* =====================================================================
 * 7. TRATAMENTO DAS MENSAGENS DO CHAT
 * ===================================================================== */
const MOVE_RE = /^[wasd\s,.]+$/i;   // aceita também "w a s d" e "w,a,s"

// Caracteres invisíveis que 7TV/FFZ/Chatterino adicionam ao repetir mensagens
// (não inclui o ZWJ \u200D, usado em emojis compostos)
const INVISIBLE_RE = /[\u00A0\u1680\u180E\u2000-\u200B\u200E\u200F\u202A-\u202F\u205F-\u2064\u2066-\u206F\u2800\u3000\u3164\u115F\u1160\u034F\uFEFF\u{E0000}-\u{E007F}]/gu;

// localEmotes: Map(nome -> url) com emotes nativos da própria mensagem (Twitch)
function handleChat(user, rawText, localEmotes) {
  const text = (rawText || '').replace(INVISIBLE_RE, ' ').replace(/\s+/g, ' ').trim();
  if (!text) return;
  if (CONFIG.ignore.includes(user.name.toLowerCase())) return;

  const b = ensureBall(user);
  b.lastActive = performance.now();

  // Para detectar comando, também remove marcas invisíveis restantes (categorias Cf/Mn/Cc)
  const cmdText = text.replace(/[\p{Cf}\p{Mn}\p{Cc}]/gu, '');

  if (MOVE_RE.test(cmdText)) {
    // "wads" vira uma sequência: cima, esquerda, baixo, direita
    for (const ch of cmdText.toLowerCase()) {
      if ('wasd'.indexOf(ch) < 0) continue;
      if (b.queue.length < PHYS.maxQueue) b.queue.push(ch);
    }
  } else {
    showPopup(b, text, localEmotes);
  }
}

/* =====================================================================
 * 8. INTEGRAÇÃO COM O CHAT: TWITCH (IRC via WebSocket)
 * ===================================================================== */
const avatarCache = new Map();

function twitchAvatar(login) {
  if (avatarCache.has(login)) return avatarCache.get(login);
  const p = (async () => {
    try {
      if (CONFIG.twitchClientId && CONFIG.twitchToken) {
        // API oficial (Helix)
        const r = await fetch('https://api.twitch.tv/helix/users?login=' + encodeURIComponent(login), {
          headers: { 'Client-Id': CONFIG.twitchClientId, 'Authorization': 'Bearer ' + CONFIG.twitchToken }
        });
        const j = await r.json();
        return (j.data && j.data[0] && j.data[0].profile_image_url) || null;
      }
      // Sem chave: serviço público decapi.me
      const r = await fetch('https://decapi.me/twitch/avatar/' + encodeURIComponent(login));
      const t = (await r.text()).trim();
      return t.startsWith('http') ? t : null;
    } catch (e) {
      console.warn('[overlay] Falha ao buscar foto de perfil da Twitch:', e);
      return null;
    }
  })();
  avatarCache.set(login, p);
  return p;
}

function parseTags(s) {
  const o = {};
  for (const kv of s.split(';')) {
    const i = kv.indexOf('=');
    if (i > 0) o[kv.slice(0, i)] = kv.slice(i + 1);
  }
  return o;
}

// Emotes nativos da Twitch: tag "emotes" = "25:0-4,12-16/1902:6-10" (índices por caractere)
function parseTwitchEmotes(tag, text) {
  const out = new Map();
  if (!tag) return out;
  const chars = Array.from(text);
  for (const part of tag.split('/')) {
    const [id, ranges] = part.split(':');
    if (!ranges || !/^\w+$/.test(id)) continue;
    const [a, z] = ranges.split(',')[0].split('-').map(Number);
    const name = chars.slice(a, z + 1).join('');
    if (name) out.set(name, 'https://static-cdn.jtvnw.net/emoticons/v2/' + id + '/default/dark/2.0');
  }
  return out;
}

function startTwitch() {
  let retry = 1000;

  const connect = () => {
    let ws;
    try {
      ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
    } catch (e) {
      console.error('[overlay] Não foi possível abrir o WebSocket da Twitch:', e);
      setTimeout(connect, retry = Math.min(retry * 2, 30000));
      return;
    }

    ws.onopen = () => {
      retry = 1000;
      ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
      ws.send('PASS SCHMOOPIIE');                               // login anônimo (somente leitura)
      ws.send('NICK justinfan' + Math.floor(10000 + Math.random() * 89999));
      ws.send('JOIN #' + CONFIG.channel);
      console.log('[overlay] Conectado ao chat da Twitch: #' + CONFIG.channel);
    };

    ws.onmessage = ev => {
      try {
        for (const line of String(ev.data).split('\r\n')) {
          if (!line) continue;
          if (line.startsWith('PING')) { ws.send('PONG :tmi.twitch.tv'); continue; }

          // ROOMSTATE traz o id numérico do canal (usado para buscar emotes do 7TV)
          const rs = line.match(/^@(\S+) :tmi\.twitch\.tv ROOMSTATE /);
          if (rs) { loadSevenTvChannel(parseTags(rs[1])['room-id']); continue; }

          const m = line.match(/^@(\S+) :([^!]+)![^ ]+ PRIVMSG #\S+ :(.*)$/);
          if (!m) continue;

          const tags = parseTags(m[1]);
          const login = m[2].toLowerCase();
          const name = (tags['display-name'] || m[2]).replace(/\\s/g, ' ');
          const text = m[3].replace(/^\u0001ACTION (.*)\u0001$/, '$1');
          loadSevenTvChannel(tags['room-id']);
          const localEmotes = parseTwitchEmotes(tags['emotes'], text);

          handleChat({
            id: 'tw:' + (tags['user-id'] || login),
            name,
            color: tags['color'] || null,
            resolveAvatar: () => twitchAvatar(login)
          }, text, localEmotes);
        }
      } catch (e) {
        console.warn('[overlay] Erro ao processar mensagem da Twitch:', e);
      }
    };

    ws.onerror = () => console.warn('[overlay] Erro na conexão com a Twitch.');
    ws.onclose = () => {
      console.warn('[overlay] Conexão com a Twitch fechada. Tentando reconectar...');
      setTimeout(connect, retry = Math.min(retry * 2, 30000));
    };
  };

  connect();
}

/* =====================================================================
 * 9. INTEGRAÇÃO COM O CHAT: YOUTUBE (Data API v3, polling)
 * ===================================================================== */
async function startYouTube() {
  const key = CONFIG.youtubeApiKey;
  if (!key || key === 'YOUR_API_KEY') {
    console.error('[overlay] Informe sua chave: &apiKey=SUA_API_KEY');
    return;
  }

  let chatId = CONFIG.youtubeChatId;
  try {
    if (!chatId) {
      if (!CONFIG.youtubeVideoId || CONFIG.youtubeVideoId === 'YOUR_VIDEO_ID') {
        console.error('[overlay] Informe o ID da live: &videoId=ID_DA_LIVE');
        return;
      }
      const url = 'https://www.googleapis.com/youtube/v3/videos?part=liveStreamingDetails&id=' +
        encodeURIComponent(CONFIG.youtubeVideoId) + '&key=' + encodeURIComponent(key);
      const j = await (await fetch(url)).json();
      if (j.error) throw new Error(j.error.message);
      chatId = j.items && j.items[0] && j.items[0].liveStreamingDetails &&
               j.items[0].liveStreamingDetails.activeLiveChatId;
      if (!chatId) throw new Error('Essa transmissão não tem chat ao vivo ativo.');
    }
  } catch (e) {
    console.error('[overlay] Falha ao iniciar o chat do YouTube:', e.message || e);
    return;
  }
  console.log('[overlay] Conectado ao chat do YouTube.');

  let pageToken = '';
  let first = true;                               // a 1ª resposta é histórico: ignorada

  const poll = async () => {
    let wait = 5000;
    try {
      const url = 'https://www.googleapis.com/youtube/v3/liveChat/messages?part=snippet,authorDetails' +
        '&liveChatId=' + encodeURIComponent(chatId) +
        '&key=' + encodeURIComponent(key) +
        (pageToken ? '&pageToken=' + encodeURIComponent(pageToken) : '');
      const j = await (await fetch(url)).json();
      if (j.error) throw new Error(j.error.message);

      wait = Math.max(j.pollingIntervalMillis || 5000, 3000);
      pageToken = j.nextPageToken || pageToken;

      if (!first) {
        for (const it of (j.items || [])) {
          if (!it.snippet || it.snippet.type !== 'textMessageEvent') continue;
          const a = it.authorDetails || {};
          handleChat({
            id: 'yt:' + (a.channelId || a.displayName),
            name: a.displayName || 'anon',
            avatarUrl: a.profileImageUrl || null       // foto de perfil vinda da API
          }, it.snippet.displayMessage || '');
        }
      }
      first = false;
    } catch (e) {
      console.warn('[overlay] Erro ao ler o chat do YouTube:', e.message || e);
      wait = 15000;
    }
    setTimeout(poll, wait);
  };
  poll();
}

/* =====================================================================
 * 11. FÍSICA (integração, bordas e colisões entre bolas)
 * ===================================================================== */
function physicsStep(dt) {
  const acc = PHYS.accel * unit;
  const dragF = Math.exp(-PHYS.drag * dt);
  const minSpeed = PHYS.hitMinSpeed * unit;
  const n = balls.length;

  for (let i = 0; i < n; i++) {
    const b = balls[i];

    // Próxima letra da fila (movimentos em sequência)
    if (b.pushT <= 0) {
      if (b.queue.length) {
        const c = b.queue.shift();
        b.dx = c === 'a' ? -1 : (c === 'd' ? 1 : 0);
        b.dy = c === 'w' ? -1 : (c === 's' ? 1 : 0);
        b.pushT = PHYS.stepSec;
      } else { b.dx = 0; b.dy = 0; }
    }
    if (b.pushT > 0) {
      b.vx += b.dx * acc * dt;
      b.vy += b.dy * acc * dt;
      b.pushT -= dt;
    }

    // Atrito (drag) e integração
    b.vx *= dragF; b.vy *= dragF;
    b.x += b.vx * dt;
    b.y += b.vy * dt;

    // Colisão com as bordas (quique)
    if (b.x < R)          { b.x = R;      if (b.vx < 0) { if (-b.vx > minSpeed) playHit(-b.vx); b.vx = -b.vx * PHYS.wallRest; } }
    else if (b.x > W - R) { b.x = W - R;  if (b.vx > 0) { if (b.vx > minSpeed)  playHit(b.vx);  b.vx = -b.vx * PHYS.wallRest; } }
    if (b.y < R)          { b.y = R;      if (b.vy < 0) { if (-b.vy > minSpeed) playHit(-b.vy); b.vy = -b.vy * PHYS.wallRest; } }
    else if (b.y > H - R) { b.y = H - R;  if (b.vy > 0) { if (b.vy > minSpeed)  playHit(b.vy);  b.vy = -b.vy * PHYS.wallRest; } }
  }

  // Colisão entre bolas (mesma massa): repulsão + troca de impulso
  const minD = 2 * R, minD2 = minD * minD;
  for (let i = 0; i < n; i++) {
    const a = balls[i];
    for (let j = i + 1; j < n; j++) {
      const c = balls[j];
      let dx = c.x - a.x, dy = c.y - a.y;
      const d2 = dx * dx + dy * dy;
      if (d2 >= minD2) continue;

      let d = Math.sqrt(d2), nx, ny;
      if (d > 0.0001) { nx = dx / d; ny = dy / d; }
      else { nx = 1; ny = 0; d = 0; }

      const half = (minD - d) * 0.5;               // separa as bolas sobrepostas
      a.x -= nx * half; a.y -= ny * half;
      c.x += nx * half; c.y += ny * half;

      const rel = (c.vx - a.vx) * nx + (c.vy - a.vy) * ny;   // velocidade relativa na normal
      if (rel < 0) {
        const imp = -(1 + PHYS.ballRest) * rel * 0.5;
        a.vx -= imp * nx; a.vy -= imp * ny;
        c.vx += imp * nx; c.vy += imp * ny;
        if (-rel > minSpeed) playHit(-rel);
      }
    }
  }
}

/* =====================================================================
 * 12. LOOP DE RENDERIZAÇÃO
 * ===================================================================== */
// Objetos reutilizados (evita criar vetores dentro do loop)
const _axis = new THREE.Vector3();
const easeOutBack = t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

let lastT = performance.now();

function frame(now) {
  requestAnimationFrame(frame);

  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.1) dt = 0.1;                         // evita saltos quando a aba fica parada
  if (dt <= 0) return;

  // Subpassos para colisões estáveis
  const sub = Math.min(4, Math.ceil(dt / 0.0112));
  for (let s = 0; s < sub; s++) physicsStep(dt / sub);

  const tiltScale = 1 / (900 * unit);
  for (let i = 0; i < balls.length; i++) {
    const b = balls[i], m = b.mesh;

    b.age += dt;
    const k = b.age < 0.45 ? easeOutBack(b.age / 0.45) : 1;     // animação de entrada
    m.scale.setScalar(Math.max(0.001, R * k));
    m.position.set(b.x, -b.y, 0);

    if (CONFIG.roll) {
      // Rolagem real: gira em torno do eixo perpendicular à velocidade
      const v = Math.hypot(b.vx, b.vy);
      if (v > 1) {
        _axis.set(b.vy, b.vx, 0).normalize();
        m.rotateOnWorldAxis(_axis, v * dt / R);
      }
    } else {
      // Só inclina na direção do movimento (a foto continua visível)
      const tx = clamp(b.vy * tiltScale, -1, 1) * 0.5;
      const ty = clamp(b.vx * tiltScale, -1, 1) * 0.5;
      m.rotation.x += (tx - m.rotation.x) * 0.15;
      m.rotation.y += (ty - m.rotation.y) * 0.15;
    }

    // Pop-up acompanha a bola
    if (b.label && b.label.style.visibility === 'visible') positionLabel(b);
  }

  renderer.render(scene, camera);
}

/* =====================================================================
 * 13. INICIALIZAÇÃO
 * ===================================================================== */
resize();
requestAnimationFrame(frame);
loadSevenTvGlobal();

try {
  if (CONFIG.demo) startDemo();
  else if (CONFIG.platform === 'youtube') startYouTube();
  else startTwitch();
} catch (e) {
  console.error('[overlay] Falha ao iniciar a integração com o chat:', e);
}

})();
