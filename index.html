<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>* O Cowboy do Mal *</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{
background:#000;
background-image:
  linear-gradient(rgba(0,80,0,0.15) 1px, transparent 1px),
  linear-gradient(90deg, rgba(0,80,0,0.15) 1px, transparent 1px);
background-size:24px 24px;
display:flex;flex-direction:column;
align-items:center;justify-content:center;
height:100vh;overflow:hidden;
font-family:'Press Start 2P',monospace;
color:#fff;user-select:none;
}

/* ── LOADING ── */
#loading-screen{
position:fixed;inset:0;background:#000;
display:flex;flex-direction:column;align-items:center;justify-content:center;
z-index:9999;gap:22px;
}
#loading-screen .title{font-size:12px;color:#fff;text-align:center;line-height:2.3;animation:blink 1.2s infinite;}
#loading-bar-wrap{width:280px;height:16px;border:3px solid #fff;background:#000; box-shadow: 0 0 10px rgba(255,255,255,0.5);}
#loading-bar{height:100%;width:0%;background:#fff;transition:width .25s;}
#loading-pct{font-size:8px;color:#777;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* ── CUTSCENE ── */
#cutscene{
position:fixed;inset:0;background:#000;
display:none;flex-direction:column;align-items:center;justify-content:center;
z-index:8888;gap:22px;
}
#cs-img{max-height:260px;object-fit:contain;image-rendering:pixelated; filter: drop-shadow(0 0 15px rgba(255,255,255,0.2));}
#cs-img.float{animation:bossFloat 2.5s ease-in-out infinite;}
#cs-img.tired{animation:bossTired 3s ease-in-out infinite;}
#cs-img.geno{animation:genoGlitch .18s linear infinite;}
#cs-box{
border:3px solid #fff;padding:16px 24px;
background:#000;max-width:520px;width:90%;
min-height:66px;position:relative;cursor:pointer;
box-shadow: 0 0 15px rgba(255,255,255,0.2);
}
#cs-box::after{content:'▼';position:absolute;bottom:7px;right:11px;font-size:8px;animation:blink .6s infinite;}
#cs-box.choice-mode::after{display:none;}
#cs-box.no-arrow::after{display:none;}
#cs-text{font-size:10px;color:#fff;line-height:2.4; text-shadow: 1px 1px 0 #000; white-space:pre-line;}
#cs-choices{display:none;gap:20px;margin-top:14px;}
.cs-choice-btn{
font-family:'Press Start 2P',monospace;font-size:9px;
padding:10px 18px;border:3px solid #fff;
background:#000;color:#fff;cursor:pointer;
transition: all 0.2s;
}
.cs-choice-btn.kill{border-color:#ff4444;color:#ff4444; box-shadow: 0 0 10px rgba(255,0,0,0.3);}
.cs-choice-btn.kill:hover{background:#ff4444;color:#000; box-shadow: 0 0 20px rgba(255,0,0,0.8);}
.cs-choice-btn.spare{border-color:#44ff88;color:#44ff88; box-shadow: 0 0 10px rgba(0,255,0,0.3);}
.cs-choice-btn.spare:hover{background:#44ff88;color:#000; box-shadow: 0 0 20px rgba(0,255,0,0.8);}

/* ── GAME ── */
#game{display:none;flex-direction:column;align-items:center;}
#boss-area{
width:700px;height:255px;
display:flex;align-items:flex-end;justify-content:center;
background:#000;padding-bottom:4px;position:relative;overflow:hidden;
}
#boss-img{
max-height:245px;object-fit:contain;
image-rendering:pixelated;transition:opacity .5s ease, filter 0.3s;
filter: drop-shadow(0 0 10px rgba(255,255,255,0.1));
}
#boss-img.float{animation:bossFloat 2s ease-in-out infinite;}
#boss-img.crazy{animation:bossCrazy .11s linear infinite; filter: drop-shadow(0 0 20px rgba(255,100,0,0.5));}
#boss-img.tired{animation:bossTired 3s ease-in-out infinite; filter: grayscale(0.5);}
#boss-img.geno{animation:genoGlitch .15s linear infinite; filter: drop-shadow(0 0 25px rgba(255,0,0,0.8));}
#boss-img.geno-ultra{animation:genoUltra .07s linear infinite; filter: drop-shadow(0 0 40px rgba(255,0,0,1));}

/* Novo Efeito de Energização */
.energize-ptc {
position: absolute;
width: 6px; height: 6px;
border-radius: 50%;
pointer-events: none;
z-index: 10;
opacity: 1;
transition: transform 0.8s ease-out, opacity 0.8s ease-out;
box-shadow: 0 0 10px currentColor;
}

@keyframes bossFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes bossCrazy{
0%{transform:translateX(0) rotate(0deg)}
25%{transform:translateX(-9px) rotate(-4deg)}
75%{transform:translateX(9px) rotate(4deg)}
100%{transform:translateX(0) rotate(0deg)}
}
@keyframes bossTired{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(8px) rotate(3deg)}}
@keyframes genoGlitch{
0%{transform:translateX(0) skewX(0deg);filter:none;}
15%{transform:translateX(-4px) skewX(-3deg);filter:hue-rotate(90deg) brightness(1.5);}
30%{transform:translateX(4px) skewX(3deg);filter:hue-rotate(180deg);}
50%{transform:translateX(-2px) skewX(0deg);filter:brightness(2) saturate(3);}
70%{transform:translateX(6px) skewX(-2deg);filter:hue-rotate(270deg);}
85%{transform:translateX(0) skewX(1deg);filter:invert(.3);}
100%{transform:translateX(0) skewX(0deg);filter:none;}
}
@keyframes genoUltra{
0%{transform:translateX(0) skewX(0) scale(1);filter:none;}
10%{transform:translateX(-8px) skewX(-6deg) scale(1.05);filter:hue-rotate(45deg) brightness(3) contrast(2);}
20%{transform:translateX(8px) skewX(6deg) scale(.95);filter:hue-rotate(120deg) invert(.5);}
35%{transform:translateX(-5px) skewY(-2deg) scale(1.02);filter:hue-rotate(200deg) brightness(2);}
50%{transform:translateX(5px) skewY(2deg) scale(.98);filter:hue-rotate(300deg) saturate(5);}
65%{transform:translateX(-3px) skewX(3deg);filter:invert(.7) brightness(2);}
80%{transform:translateX(10px) skewX(-4deg);filter:hue-rotate(360deg) contrast(3);}
100%{transform:translateX(0) skewX(0) scale(1);filter:none;}
}

/* ── FASE EXTRA FINAL (FASE 4) ── */
#boss-img.p4-flicker{animation:p4Flicker .12s steps(1) infinite;}
@keyframes p4Flicker{
0%{opacity:1;filter:grayscale(1) brightness(1.4) contrast(1.3);}
20%{opacity:.2;filter:grayscale(1) brightness(.4);}
35%{opacity:1;filter:grayscale(1) brightness(1.8) contrast(1.6) hue-rotate(20deg);}
55%{opacity:.05;filter:grayscale(1);}
70%{opacity:.9;filter:grayscale(1) invert(.15) brightness(1.2);}
100%{opacity:1;filter:grayscale(1) brightness(1.1);}
}
#boss-img.p4-glitch{animation:p4Glitch .1s linear infinite;}
@keyframes p4Glitch{
0%{transform:translate(0,0) skewX(0deg) scale(1);filter:grayscale(1) contrast(1.4);}
10%{transform:translate(-10px,3px) skewX(-8deg) scale(1.04);filter:grayscale(1) hue-rotate(60deg) brightness(2);}
25%{transform:translate(9px,-4px) skewX(6deg) scale(.96);filter:grayscale(.6) invert(.4);}
40%{transform:translate(-6px,6px) skewX(-3deg);filter:grayscale(1) contrast(2) brightness(.6);}
55%{transform:translate(8px,-2px) skewY(3deg);filter:grayscale(1) hue-rotate(180deg);}
70%{transform:translate(-4px,-5px) skewX(4deg);filter:grayscale(.8) invert(.2) brightness(1.5);}
85%{transform:translate(5px,3px) skewX(-2deg);filter:grayscale(1) contrast(1.6);}
100%{transform:translate(0,0) skewX(0deg) scale(1);filter:grayscale(1);}
}
#boss-img.p4-hope{animation:bossFloat 2.4s ease-in-out infinite; filter:drop-shadow(0 0 25px rgba(255,255,255,.6)) drop-shadow(0 0 50px rgba(150,200,255,.4));}
#boss-img.p4-ultra{animation:genoUltra .06s linear infinite; filter:drop-shadow(0 0 45px rgba(255,255,255,1)) drop-shadow(0 0 70px rgba(120,180,255,.7));}
#boss-img.p4-varied{animation:bossCrazy .16s linear infinite; filter:drop-shadow(0 0 20px rgba(255,255,255,.5));}
#boss-img.p4-evapor{animation:p4Evapor 3.5s ease-in-out infinite; filter:drop-shadow(0 0 15px rgba(200,220,255,.4)) grayscale(.3);}
@keyframes p4Evapor{
0%,100%{transform:translateY(0) scale(1);opacity:1;}
50%{transform:translateY(-14px) scale(1.015);opacity:.75;}
}
#boss-img.p4-ghost{animation:p4Ghost 2.6s ease-in-out infinite; filter:drop-shadow(0 0 18px rgba(220,230,255,.5)) grayscale(.7) brightness(1.15);}
@keyframes p4Ghost{
0%,100%{transform:translateY(0);opacity:.55;}
50%{transform:translateY(-20px);opacity:.85;}
}
#boss-img.p4-rainbow{filter:
drop-shadow(0 0 10px #ff0044) drop-shadow(0 0 20px #ff8800)
drop-shadow(0 0 30px #ffee00) drop-shadow(0 0 40px #00ff88)
drop-shadow(0 0 50px #00aaff) drop-shadow(0 0 60px #aa00ff);
animation:p4RainbowSpin .5s linear infinite, p4RainbowFly 2.6s ease-in-out infinite;
z-index:60;position:relative;
}
@keyframes p4RainbowSpin{
0%{filter:hue-rotate(0deg) drop-shadow(0 0 30px #fff) brightness(1.3);}
100%{filter:hue-rotate(360deg) drop-shadow(0 0 30px #fff) brightness(1.3);}
}
@keyframes p4RainbowFly{
0%{transform:translate(0,0) scale(1);}
20%{transform:translate(-140px,-40px) scale(.8) rotate(-10deg);}
40%{transform:translate(150px,20px) scale(.75) rotate(12deg);}
60%{transform:translate(-100px,50px) scale(.85) rotate(-8deg);}
80%{transform:translate(120px,-60px) scale(.78) rotate(9deg);}
100%{transform:translate(0,0) scale(1) rotate(0deg);}
}
#boss-area.p4-rainbow-area{overflow:visible !important;z-index:20;}
#boss-img.p4-nuke{animation:p4NukeFlash .05s linear infinite;filter:brightness(6) contrast(3) grayscale(0);}
@keyframes p4NukeFlash{
0%{filter:brightness(8) grayscale(0) hue-rotate(0deg);}
50%{filter:brightness(2) grayscale(.5) hue-rotate(180deg);}
100%{filter:brightness(10) grayscale(0) hue-rotate(360deg);}
}
#p4-bg-gif{
position:absolute;inset:0;background-size:cover;background-position:center;
opacity:0;transition:opacity 1.2s ease-in-out;pointer-events:none;z-index:1;
}
#p4-bg-gif.on{opacity:1;}
#boss-area.p4-arena{width:900px;height:520px;}
.p4-particle{
position:absolute;border-radius:50%;pointer-events:none;z-index:15;
box-shadow:0 0 12px currentColor;
}
.p4-rain-trail{
position:absolute;pointer-events:none;z-index:59;border-radius:50%;
mix-blend-mode:screen;
}
#p4-explosion{
position:fixed;inset:0;pointer-events:none;z-index:6500;
background:radial-gradient(circle,#fff 0%,#aad4ff 25%,transparent 70%);
opacity:0;
}
#p4-nuke-flash{
position:fixed;inset:0;pointer-events:none;z-index:9500;
background:#fff;opacity:0;
}
#hud.p4-destroyed{animation:p4HudBreak .6s forwards;}
@keyframes p4HudBreak{
0%{opacity:1;transform:translateY(0) scaleX(1);filter:none;}
30%{opacity:.7;transform:translateY(4px) scaleX(1.02);filter:hue-rotate(90deg);}
60%{opacity:.3;transform:translateY(-6px) scaleX(.9) skewX(8deg);filter:invert(.6);}
100%{opacity:0;transform:translateY(30px) scaleX(.4);filter:brightness(3);}
}
#p4-end-text{
display:none;position:fixed;inset:0;z-index:9600;
flex-direction:column;align-items:center;justify-content:center;gap:26px;
background:rgba(0,0,0,0);
}
#p4-end-line1,#p4-end-line2{
font-size:16px;color:#fff;text-shadow:2px 2px 0 #000,0 0 20px rgba(255,255,255,.6);
opacity:0;transition:opacity 1.2s ease-in;text-align:center;
}
#p4-end-line1.show,#p4-end-line2.show{opacity:1;}
#arena.p4-hurt-heavy{animation:p4HurtHeavy .2s forwards;}
@keyframes p4HurtHeavy{0%{background:#ff2222}100%{background:#000}}
#heart.p4-frail{filter:drop-shadow(0 0 8px #ff0000) drop-shadow(0 0 4px #fff);}

/* ── NOVOS EFEITOS VISUAIS EXTRA — FASE 4 ── */
.p4-fall-particle{
box-shadow:0 0 8px currentColor;
}
#arena.p4-pulse{animation:p4ArenaPulse 1.6s ease-in-out infinite;}
@keyframes p4ArenaPulse{
0%,100%{box-shadow:inset 0 0 40px rgba(255,255,255,.15), 0 0 20px rgba(150,200,255,.35);}
50%{box-shadow:inset 0 0 70px rgba(255,255,255,.3), 0 0 40px rgba(150,200,255,.6);}
}
#p4-vignette{
position:fixed;inset:0;pointer-events:none;z-index:5900;
background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.55) 100%);
opacity:0;transition:opacity 1s ease;
}
#p4-vignette.on{opacity:1;}
.p4-ring{
position:absolute;border-radius:50%;pointer-events:none;z-index:12;
border:2px solid #fff;opacity:.8;
animation:p4RingExpand 900ms ease-out forwards;
}
@keyframes p4RingExpand{
0%{transform:scale(0.2);opacity:.9;}
100%{transform:scale(3.2);opacity:0;}
}
.p4-spark{
position:absolute;pointer-events:none;z-index:16;border-radius:50%;
box-shadow:0 0 10px currentColor;
animation:p4SparkPop 500ms ease-out forwards;
}
@keyframes p4SparkPop{
0%{transform:scale(1) translate(0,0);opacity:1;}
100%{transform:scale(0.2) translate(var(--sx),var(--sy));opacity:0;}
}
#boss-area.p4-shockwave-active{overflow:visible;}
.p4-screen-crack{
position:fixed;inset:0;pointer-events:none;z-index:9400;
opacity:0;mix-blend-mode:screen;
background:
linear-gradient(105deg,transparent 48%,rgba(255,255,255,.9) 49%,transparent 51%),
linear-gradient(15deg,transparent 60%,rgba(255,255,255,.6) 61%,transparent 63%);
}
.p4-screen-crack.show{animation:p4CrackFlash .35s ease-out forwards;}
@keyframes p4CrackFlash{0%{opacity:1;}100%{opacity:0;}}

/* Genocide background glitch overlay */
#geno-bg{
position:absolute;inset:0;pointer-events:none;z-index:5;
display:none;overflow:hidden;
}
.geno-line{
position:absolute;left:0;right:0;height:2px;
background:rgba(255,0,0,.5);
animation:glitchLine .3s linear infinite;
}
@keyframes glitchLine{
0%{transform:translateX(0);opacity:.8;}
50%{transform:translateX(-10px);opacity:.3;}
100%{transform:translateX(5px);opacity:.8;}
}
/* ── FASE 3 ── */
#boss-img.p3fast{animation:bossCrazy .09s linear infinite; filter: drop-shadow(0 0 25px rgba(255,0,60,0.8));}
#boss-img.p3calm{animation:bossTired 2.6s ease-in-out infinite; filter: drop-shadow(0 0 12px rgba(255,255,255,0.2));}
#cs-img.dodge-anim{animation:dodgeAnim .5s ease-in-out 2;}
@keyframes dodgeAnim{
0%{transform:translateX(0) scale(1);}
20%{transform:translateX(-42px) scale(1.06) rotate(-6deg);}
40%{transform:translateX(34px) scale(.94) rotate(5deg);}
60%{transform:translateX(-16px) scale(1.02) rotate(-2deg);}
80%{transform:translateX(9px) rotate(1deg);}
100%{transform:translateX(0) rotate(0deg);}
}
#battle-dialogue{
display:none;position:absolute;top:8px;left:8px;right:8px;
border:3px solid #fff;background:rgba(0,0,0,.93);
padding:10px 14px;z-index:300;min-height:44px;
box-shadow:0 0 15px rgba(255,0,0,.35);cursor:pointer;
}
#battle-dialogue #bd-text{font-size:9px;color:#fff;line-height:2.1;text-shadow:1px 1px 0 #000;white-space:pre-line;}
#battle-dialogue::after{content:'▼';position:absolute;bottom:5px;right:9px;font-size:7px;animation:blink .6s infinite;}
#arena{
width:580px;height:340px;border:4px solid #fff;
background:#000;
background-image:
  linear-gradient(rgba(0,120,0,0.25) 1px, transparent 1px),
  linear-gradient(90deg, rgba(0,120,0,0.25) 1px, transparent 1px);
background-size:20px 20px;
position:relative;margin:12px auto;overflow:hidden;flex-shrink:0;
box-shadow: inset 0 0 20px rgba(0,255,0,0.08);
transition: border-color 0.3s, box-shadow 0.3s, width 0.5s, height 0.5s;
}

/* Novo: Efeito de Modo Lento */
#arena.slow-mode {
box-shadow: inset 0 0 40px rgba(0, 150, 255, 0.35), 0 0 20px rgba(0, 150, 255, 0.4) !important;
border-color: #aaddff !important;
}

#arena.geno-arena{border-color:#ff2222;box-shadow: inset 0 0 30px rgba(255,0,0,0.2), 0 0 12px #ff0000;}
#arena.geno-ultra-arena{border-color:#ff0000;box-shadow:inset 0 0 50px rgba(255,0,0,0.4), 0 0 25px #ff0000,0 0 50px #ff440044;animation:borderPulse .2s linear infinite;}
@keyframes borderPulse{0%,100%{box-shadow:inset 0 0 50px rgba(255,0,0,0.4), 0 0 25px #ff0000}50%{box-shadow:inset 0 0 70px rgba(255,0,0,0.6), 0 0 45px #ff4400,0 0 80px #ff000044}}

/* Efeito de Rastro (Trails) */
#trail-canvas {
position: absolute;
top: 0; left: 0;
pointer-events: none;
z-index: 10;
mix-blend-mode: screen;
}

#heart{
position:absolute;width:16px;height:16px;
font-size:15px;display:flex;align-items:center;justify-content:center;
z-index:100;filter:drop-shadow(0 0 8px #ff0000);pointer-events:none;
transition: transform 0.05s linear;
color: #ff0000;
}
#heart.moving { transform: scale(0.9) rotate(5deg); }
#heart.death-tremble{animation:heartTremble .08s linear infinite;}
@keyframes heartTremble{
0%{transform:translate(0,0) scale(1);}
25%{transform:translate(-2px,1px) scale(1.05);}
50%{transform:translate(2px,-1px) scale(0.95);}
75%{transform:translate(-1px,-2px) scale(1.08);}
100%{transform:translate(0,0) scale(1);}
}
#heart.death-explode{animation:heartExplode .6s ease-out forwards;}
@keyframes heartExplode{
0%{transform:scale(1);opacity:1;filter:drop-shadow(0 0 8px #ff0000);}
40%{transform:scale(1.8);opacity:1;filter:drop-shadow(0 0 20px #ff0000) brightness(2);}
100%{transform:scale(0);opacity:0;filter:drop-shadow(0 0 40px #fff);}
}

/* ── BLASTERS ── */
.blaster-beam{
position:absolute;pointer-events:none;z-index:55;
animation: beamBlast 0.4s ease-out forwards;
}
@keyframes beamBlast {
0% { opacity: 1; transform: scaleY(1.5); }
50% { opacity: 0.8; transform: scaleY(1); }
100% { opacity: 0; transform: scaleY(0.1); }
}

.blaster-beam.normal{
background:linear-gradient(transparent 0%,#ff8800 30%,#ffff00 50%,#ff8800 70%,transparent 100%);
box-shadow:0 0 25px #ff8800,0 0 50px #ffaa0088;
}
.blaster-beam.red{
background:linear-gradient(transparent 0%,#ff0000 30%,#ff8888 50%,#ff0000 70%,transparent 100%);
box-shadow:0 0 30px #ff0000,0 0 60px #ff000088;
}
.blaster-beam.diag{
background:linear-gradient(transparent 0%,#aa00ff 30%,#ff88ff 50%,#aa00ff 70%,transparent 100%);
box-shadow:0 0 25px #aa00ff,0 0 50px #cc00ff88;
}
.blaster-warn{
position:absolute;pointer-events:none;z-index:54;
background:rgba(255,100,0,.15);border:1px dashed #ff8800;
animation: warningBlink 0.2s infinite;
}
.blaster-warn.red-warn{background:rgba(255,0,0,.2);border:1px dashed #ff0000;}
.blaster-warn.diag-warn{background:rgba(170,0,255,.15);border:1px dashed #aa00ff;}
@keyframes warningBlink { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

/* shots */
.shot{
position:absolute;pointer-events:none;z-index:50;
transition: opacity 0.1s;
}

/* ── HUD ── */
#hud{width:100%;display:flex;align-items:center;gap:10px;padding:7px 16px 9px;border-top:3px solid #fff;}
#hud-label{font-size:8px;white-space:nowrap;flex-shrink:0; color: #fff;}
#hp-bg{flex:1;height:14px;background:#800000;border:2px solid #fff; position: relative;}
#hp-bar{height:100%;width:100%;background:#ffff00;transition:width .1s, background-color 0.2s;}
#hp-num{font-size:8px;white-space:nowrap;flex-shrink:0; color: #fff;}
#heal-row{width:100%;display:flex;align-items:center;gap:8px;padding:0 16px 8px;}
#heal-label{font-size:7px;color:#aaa;flex-shrink:0;}
.charge{width:12px;height:12px;border:2px solid #fff;border-radius:50%;background:#44ff44;transition:background .2s, box-shadow 0.2s; box-shadow: 0 0 5px #44ff44;}
.charge.used{background:#333;border-color:#555; box-shadow: none;}
#heal-key{font-size:7px;color:#777;margin-left:6px;}

@keyframes dmgFlash{0%{background:#ff0000}100%{background:#000}}
#arena.hurt{animation:dmgFlash .15s forwards;}
@keyframes healFlash{0%{background:#00ff5533}100%{background:#000}}
#arena.healed{animation:healFlash .25s forwards;}

/* ── OVERLAY ── */
#overlay{
display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:7777;
flex-direction:column;align-items:center;justify-content:center;gap:26px;
backdrop-filter: blur(3px);
}
#ov-title{font-size:24px; text-shadow: 2px 2px 0 #000;}
#ov-sub{font-size:10px;color:#ccc;line-height:2.6;text-align:center;}
#ov-btn{
font-family:'Press Start 2P',monospace;font-size:10px;
background:#000;color:#fff;border:3px solid #fff;
padding:12px 22px;cursor:pointer; transition: all 0.2s;
}
#ov-btn:hover{background:#fff;color:#000; box-shadow: 0 0 15px rgba(255,255,255,0.8);}

/* ── FX ── */
#phase-flash{position:fixed;inset:0;pointer-events:none;z-index:6000;background:#ff4400;opacity:0;transition:opacity .08s;}

let AC=null;
function getAC(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();return AC;}
function playTone(freq,type,dur,vol=.3){
try{const ac=getAC(),o=ac.createOscillator(),g=ac.createGain();
o.type=type;o.frequency.setValueAtTime(freq,ac.currentTime);
g.gain.setValueAtTime(vol,ac.currentTime);
g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);
o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+dur);}catch(e){}
}
function playNoise(dur,vol=.15,freq=800){
try{const ac=getAC(),buf=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate);
const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
const src=ac.createBufferSource(),filt=ac.createBiquadFilter(),g=ac.createGain();
src.buffer=buf;filt.type='bandpass';filt.frequency.value=freq;filt.Q.value=.8;
g.gain.setValueAtTime(vol,ac.currentTime);
g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);
src.connect(filt);filt.connect(g);g.connect(ac.destination);
src.start();src.stop(ac.currentTime+dur);}catch(e){}
}
function sndDamage(){playNoise(.12,.4,1200);playTone(180,'sawtooth',.15,.25);}
function sndHeal(){[440,554,659,880].forEach((f,i)=>setTimeout(()=>playTone(f,'sine',.18,.22),i*55));}
function sndDeath(){playNoise(.6,.6,400);[300,220,160,100].forEach((f,i)=>setTimeout(()=>playTone(f,'sawtooth',.25,.35),i*80));}
function sndTransform(){playNoise(.35,.7,200);setTimeout(()=>{[80,120,200,340].forEach((f,i)=>setTimeout(()=>playTone(f,'square',.2,.4),i*60));},80);}
function sndTalk(){playTone(rand(200,320)|0,'square',.045,.12);}
function sndGenoTalk(){playTone(rand(80,140)|0,'sawtooth',.06,.15);}
function sndBlasterCharge(){
try{const ac=getAC(),o=ac.createOscillator(),g=ac.createGain();
o.type='sawtooth';
o.frequency.setValueAtTime(80,ac.currentTime);
o.frequency.linearRampToValueAtTime(600,ac.currentTime+1.2);
g.gain.setValueAtTime(.015,ac.currentTime);
g.gain.linearRampToValueAtTime(.12,ac.currentTime+1.0);
g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+1.4);
o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+1.5);}catch(e){}
}
function sndRedBlasterCharge(){
try{const ac=getAC(),o=ac.createOscillator(),g=ac.createGain();
o.type='square';
o.frequency.setValueAtTime(60,ac.currentTime);
o.frequency.linearRampToValueAtTime(800,ac.currentTime+2.2);
g.gain.setValueAtTime(.015,ac.currentTime);
g.gain.linearRampToValueAtTime(.12,ac.currentTime+2.0);
g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+2.5);
o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+2.6);}catch(e){}
}

}

function onPlayerReady(e){
e.target.mute();e.target.playVideo();
let ready=false;
let iv=setInterval(()=>{
if(!ytPlayer||!ytPlayer.getPlayerState)return;
let state=ytPlayer.getPlayerState();
let frac=ytPlayer.getVideoLoadedFraction?ytPlayer.getVideoLoadedFraction():0;
let pct=Math.round(frac*100);
document.getElementById('loading-bar').style.width=pct+'%';
document.getElementById('loading-pct').textContent=pct+'%';
if(!ready&&(state===1||state===2||pct>=15)){
ready=true;clearInterval(iv);
ytPlayer.stopVideo();ytPlayer.unMute();ytPlayer.setVolume(72);
document.getElementById('loading-screen').style.display='none';
startIntroCutscene();
}
},250);

let csIdx=0,csTyping=false,csCharIdx=0,csIv=null,csTalkIv=null;
let csLines=[],csOnDone=null,csChoiceMode=false,csGenoMode=false;

function runCutscene(lines,imgSrc,imgClass,onDone,genoVoice=false){
csLines=lines;csOnDone=onDone;csChoiceMode=false;csGenoMode=genoVoice;
const cs=document.getElementById('cutscene');
const img=document.getElementById('cs-img');
const box=document.getElementById('cs-box');
img.src=imgSrc;img.className=imgClass||'float';
img.style.opacity='1';
box.classList.remove('choice-mode','no-arrow');
document.getElementById('cs-choices').style.display='none';
cs.style.display='flex';
showCSLine(0);
document.addEventListener('keydown',csKey);
box.onclick=csAdvance;
}

function showCSLine(i){
if(i>=csLines.length){endCutscene();return;}
csIdx=i;csCharIdx=0;csTyping=true;
document.getElementById('cs-text').textContent='';
if(csIv)clearInterval(csIv);
if(csTalkIv)clearInterval(csTalkIv);
let talkFn=csGenoMode?sndGenoTalk:sndTalk;
csTalkIv=setInterval(()=>{if(csTyping)talkFn();},70);
csIv=setInterval(()=>{
document.getElementById('cs-text').textContent=csLines[csIdx].slice(0,csCharIdx++);
if(csCharIdx>csLines[csIdx].length){
clearInterval(csIv);clearInterval(csTalkIv);csTyping=false;
}
},36);
}
function csAdvance(){
if(csChoiceMode)return;
if(csTyping){
clearInterval(csIv);clearInterval(csTalkIv);csTyping=false;
document.getElementById('cs-text').textContent=csLines[csIdx];
}else{showCSLine(csIdx+1);}
}
function csKey(e){if(['z','Z','Enter',' '].includes(e.key))csAdvance();}
function endCutscene(){
document.removeEventListener('keydown',csKey);
if(csOnDone)csOnDone();
}

waveLockTimer=gap;

function p3SetSub(name,attacks,interval,gap,sprite){
if(phase3SubPhase===name)return;
phase3SubPhase=name;phase3AttacksOn=attacks;
if(attacks){attackTimer=0;phase3AttackInterval=interval;phase3AttackGap=gap;}

let isSlow = name.includes('slow') || name.includes('dialogue') || name.includes('frozen') || name.includes('end');
let currentSpeedMode = isSlow ? 'slow' : 'fast';
if (currentSpeedMode !== lastSpeedMode) {
    shakeScreen();
    lastSpeedMode = currentSpeedMode;
    let arena = document.getElementById('arena');
    if (isSlow) arena.classList.add('slow-mode');
    else arena.classList.remove('slow-mode');
}

const img=document.getElementById('boss-img');
img.src=sprite;
img.className=(sprite===SPRITE_FAST)?'p3fast':'p3calm';
}

function movePlayer(){
let isMoving = false;
if(keysHeld['a']||keysHeld['A']) { px-=SPDHEART; isMoving = true; }
if(keysHeld['d']||keysHeld['D']) { px+=SPDHEART; isMoving = true; }
if(keysHeld['w']||keysHeld['W']) { py-=SPDHEART; isMoving = true; }
if(keysHeld['s']||keysHeld['S']) { py+=SPDHEART; isMoving = true; }
px=clamp(px,1,AW-HW-1);py=clamp(py,1,AH-HH-1);

let heart = document.getElementById('heart');
if(isMoving) heart.classList.add('moving');
else heart.classList.remove('moving');
}

let healKeyWasUp=true;
function handleHeal(dt){
if(healCooldown>0)healCooldown-=dt;
if((keysHeld['x']||keysHeld['X'])&&healCharges>0&&healCooldown<=0&&playerHP<maxHP&&healKeyWasUp){
healKeyWasUp=false;
healCharges--;healCooldown=HEAL_CD;
playerHP=Math.min(maxHP,playerHP+HEAL_AMT);
updateHP();updateCharges();sndHeal();
let arena=document.getElementById('arena');
let pop=document.createElement('div');
pop.className='heal-popup';pop.textContent='+'+HEAL_AMT;
pop.style.left=(px+2)+'px';pop.style.top=(py-10)+'px';
arena.appendChild(pop);setTimeout(()=>pop.remove(),900);
arena.classList.remove('healed');void arena.offsetWidth;arena.classList.add('healed');

if(!keysHeld['x']&&!keysHeld['X'])healKeyWasUp=true;
}

// GUN BLASTER SYSTEM
// ══════════════════════════════════════════════════════════════
const BLASTER_CHARGE_NORMAL=1000;
const BLASTER_CHARGE_RED=1500;
const BLASTER_FIRE_NORMAL=400;
const BLASTER_FIRE_RED=1200;

function spawnGunBlaster(variant, customX=-1, customY=-1){
let chargeTime=variant.startsWith('red')?BLASTER_CHARGE_RED:BLASTER_CHARGE_NORMAL;
let fireTime=variant.startsWith('red')?BLASTER_FIRE_RED:BLASTER_FIRE_NORMAL;
const isRed=variant.startsWith('red');
const isDiag=variant.startsWith('diag');
const arena=document.getElementById('arena');

let warnEl=document.createElement('div');
let beamEl=document.createElement('div');

if(isDiag){
let angle=rand(25,65)*(Math.random()>.5?1:-1);
let cx=customX !== -1 ? customX : rand(AW*.1,AW*.9);
let cy=customY !== -1 ? customY : rand(AH*.1,AH*.9);
let len=Math.sqrt(AW*AW+AH*AH)*1.5;
let beamH=18;

warnEl.className='blaster-warn diag-warn';
let warnLen=len;
warnEl.style.cssText=`left:${cx-warnLen/2}px;top:${cy-3}px;width:${warnLen}px;height:6px;`+
`transform:rotate(${angle}deg);transform-origin:50% 50%;`;

beamEl.className='blaster-beam diag';
beamEl.style.cssText=`left:${cx-len/2}px;top:${cy-beamH/2}px;`+
`width:${len}px;height:${beamH}px;`+
`transform:rotate(${angle}deg);transform-origin:50% 50%;display:none;`;

arena.appendChild(warnEl);arena.appendChild(beamEl);
if(isRed)sndRedBlasterCharge();else sndBlasterCharge();

blasters.push({
type:'diag',angle,cx,cy,len,beamH,
beamX:cx-len/2,beamY:cy-beamH/2,beamW:len,bH:beamH,angleRad:angle*Math.PI/180,
timer:chargeTime,fireTimer:fireTime,state:'charge',
beamEl,warnEl,isRed
});
return;
}

let dir=variant==='red-v'?'v':variant==='red-h'?'h':variant;
let beamW,beamH,warnX,warnY,warnW,warnH,beamX,beamY;
if(dir==='h'){
let y=customY !== -1 ? customY : rand(20,AH-50);
beamW=AW+20;beamH=22;
warnX=0;warnY=y+4;warnW=AW;warnH=14;
beamX=0;beamY=warnY;
}else{
let x=customX !== -1 ? customX : rand(20,AW-50);
beamW=22;beamH=AH+20;
warnX=x+4;warnY=0;warnW=14;warnH=AH;
beamX=warnX;beamY=0;
}

let warnClass='blaster-warn'+(isRed?' red-warn':'');
let beamClass='blaster-beam '+(isRed?'red':'normal');

warnEl.className=warnClass;
warnEl.style.cssText=`left:${warnX}px;top:${warnY}px;width:${warnW}px;height:${warnH}px;`;
beamEl.className=beamClass;
beamEl.style.cssText=`left:${beamX}px;top:${beamY}px;width:${beamW}px;height:${beamH}px;display:none;`;

arena.appendChild(warnEl);arena.appendChild(beamEl);
if(isRed)sndRedBlasterCharge();else sndBlasterCharge();

blasters.push({
type:'straight',dir,
beamX,beamY,beamW,beamH:beamH,
timer:chargeTime,fireTimer:fireTime,state:'charge',
beamEl,warnEl,isRed
});
}

function updateBlasters(dt){
for(let i=blasters.length-1;i>=0;i--){
let b=blasters[i];
b.timer-=dt;
if(b.state==='charge'&&b.timer<=0){
b.state='fire';b.timer=b.fireTimer;
if(b.warnEl&&b.warnEl.parentNode)b.warnEl.remove();
b.beamEl.style.display='block';
sndBlasterFire();shakeScreen();
let arena=document.getElementById('arena');
arena.classList.remove('healed');
}else if(b.state==='fire'){
if(!invincible){
let hcx=px+HW/2,hcy=py+HH/2;
if(b.type==='diag'){
let dx=hcx-b.cx,dy=hcy-b.cy;
let cos=Math.cos(-b.angleRad),sin=Math.sin(-b.angleRad);
let rx=dx*cos-dy*sin,ry=dx*sin+dy*cos;
if(Math.abs(ry)<b.bH/2+5&&Math.abs(rx)<b.len/2){
takeDamage(b.isRed?35:22);
}
}else{
if(hcx>b.beamX&&hcx<b.beamX+b.beamW&&hcy>b.beamY&&hcy<b.beamY+b.beamH){
takeDamage(b.isRed?35:22);
}
}
}
if(b.timer<=0){
if(b.beamEl) {
    b.beamEl.style.opacity = '0';
    setTimeout(()=>b.beamEl.remove(), 400);
}
if(b.warnEl&&b.warnEl.parentNode)b.warnEl.remove();
blasters.splice(i,1);
}
}
}
}

function clearBlasterDom(){
blasters.forEach(b=>{
if(b.beamEl&&b.beamEl.parentNode)b.beamEl.remove();
if(b.warnEl&&b.warnEl.parentNode)b.warnEl.remove();
});
blasters=[];
}

function patSineWaves() {
    let count = crazy() ? 20 : 15;
    let spd = crazy() ? 3.5 : 2.5;
    let startY = rand(50, AH-50);
    for(let i=0; i<count; i++) {
        setTimeout(()=>{
            if(!gameRunning) return;
            let py1 = startY + Math.sin(i*0.5) * 80;
            let py2 = startY + Math.sin(i*0.5 + Math.PI) * 80;
            bullets.push(mkShot(-20, py1, 10, 10, spd, 0, '#44aaff'));
            bullets.push(mkShot(AW+20, py2, 10, 10, -spd, 0, '#ff44aa'));
        }, i*150);
    }
}

function patClosingGaps() {
    let waves = crazy() ? 4 : 3;
    let spd = crazy() ? 3 : 2.2;
    for(let w=0; w<waves; w++) {
        setTimeout(()=>{
            if(!gameRunning) return;
            let gapY = py + rand(-30, 30);
            gapY = clamp(gapY, 40, AH-40);
            for(let y=0; y<AH; y+=20) {
                if(Math.abs(y - gapY) < (crazy()?35:45)) continue;
                let fromLeft = w%2===0;
                bullets.push(mkShot(fromLeft ? -20 : AW+20, y, 15, 6, fromLeft?spd:-spd, 0, '#fff'));
            }
        }, w*800);
    }
}

function patTargetedLines() {
    let lines = crazy() ? 5 : 3;
    let spd = crazy() ? 4 : 3;
    for(let i=0; i<lines; i++) {
        setTimeout(()=>{
            if(!gameRunning) return;
            let hcx = px + HW/2, hcy = py + HH/2;
            let dx = hcx - AW/2, dy = hcy - AH/2;
            let dist = Math.sqrt(dx*dx+dy*dy) || 1;
            let vx = (dx/dist)*spd, vy = (dy/dist)*spd;
            for(let j=0; j<4; j++) {
                setTimeout(()=>{
                    bullets.push(mkShot(AW/2, AH/2, 8, 8, vx, vy, '#ffdd00'));
                }, j*80);
            }
        }, i*600);
    }
}

function patGridBlasters() {
    let safeCol = Math.floor(rand(0, 3));
    let safeRow = Math.floor(rand(0, 3));

// ══════════════════════════════════════════════════════════════
// UPDATE BULLETS
// ══════════════════════════════════════════════════════════════
function updateBullets(dt){
const mul=dt/16,hcx=px+HW/2,hcy=py+HH/2,hitR=5;
for(let i=bullets.length-1;i>=0;i--){
let b=bullets[i];

if(b.type === 'aim-shot') {
    if(b.aimTime > 0) {
        b.aimTime -= dt;
        b.angle = Math.atan2(hcy - (b.y+b.h/2), hcx - (b.x+b.w/2));
        b.blink = (Math.floor(b.aimTime / 80) % 2 === 0);
        if(b.aimTime <= 0) {
            b.vx = Math.cos(b.angle) * b.spd;
            b.vy = Math.sin(b.angle) * b.spd;
            b.type = 'shot';
            b.blink = false;
        } else {
            continue;
        }
    }
}

if(b.homingTime && b.homingTime > 0) {
    b.homingTime -= dt;
    let dx = hcx - b.x;
    let dy = hcy - b.y;
    let dist = Math.sqrt(dx*dx+dy*dy) || 1;
    let speed = Math.sqrt(b.vx*b.vx + b.vy*b.vy);
    b.vx = b.vx * 0.9 + (dx/dist)*speed * 0.1;
    b.vy = b.vy * 0.9 + (dy/dist)*speed * 0.1;
}

if(b.p3fake){
    b.p3fakeTimer=(b.p3fakeTimer||0)+dt;
    if(b.p3fakeTimer>420){bullets.splice(i,1);continue;}
}
if(b.p3trap){
    b.p3trapTimer-=dt;
    if(b.p3trapTimer<=0){
        b.p3trap=false;b.color='#ff2222';
        b.vx*=1.9;b.vy*=1.9;
    }
}
if(b.p3split){
    b.p3splitTimer-=dt;
    if(b.p3splitTimer<=0){
        b.p3split=false;
        let baseA=Math.atan2(b.vy,b.vx),spd=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
        [-0.5,0,0.5].forEach(off=>{
            let a=baseA+off;
            bullets.push(mkShot(b.x,b.y,10,10,Math.cos(a)*spd,Math.sin(a)*spd,'#ff0066'));
        });
        bullets.splice(i,1);continue;
    }
}

b.x+=b.vx*mul;b.y+=b.vy*mul;
if(b.bounceV){
let bh=b.h||b.r*2||10;
if(b.y<0){b.y=0;b.vy=Math.abs(b.vy);}
if(b.y>AH-bh){b.y=AH-bh;b.vy=-Math.abs(b.vy);}
}
const m=80;
if(b.x<-m||b.x>AW+m||b.y<-m||b.y>AH+m){bullets.splice(i,1);continue;}

if(!invincible){
let hit=false;
if(b.type==='ball'){let dx=hcx-(b.x+b.r),dy=hcy-(b.y+b.r);hit=Math.sqrt(dx*dx+dy*dy)<b.r+hitR;}
else{
    let bCx = b.x + b.w/2, bCy = b.y + b.h/2;
    let r1 = Math.min(b.w, b.h)/2;
    let dx = hcx - bCx, dy = hcy - bCy;
    hit = Math.sqrt(dx*dx+dy*dy) < (r1 + hitR - 2);
}
if(hit){
    let isMoving = keysHeld['w'] || keysHeld['W'] || 
                   keysHeld['a'] || keysHeld['A'] || 
                   keysHeld['s'] || keysHeld['S'] || 
                   keysHeld['d'] || keysHeld['D'];
    if(b.isBlue && !isMoving) {
        // imune
    } else if (b.type === 'heal') {
        playerHP = Math.min(maxHP, playerHP + 50);
        updateHP(); sndHeal();
        let arena=document.getElementById('arena');
        let pop=document.createElement('div');
        pop.className='heal-popup';pop.textContent='+50';
        pop.style.left=(px+2)+'px';pop.style.top=(py-10)+'px';
        arena.appendChild(pop);setTimeout(()=>pop.remove(),900);
        arena.classList.remove('healed');void arena.offsetWidth;arena.classList.add('healed');
        bullets.splice(i, 1);
    } else {
        takeDamage(gamePhase==='p3' ? p3DamageAmt() : (gamePhase==='abuelita' ? (abuelitaSubPhase==='final'?30:20) : (gamePhase==='abuelita2' ? (abuelita2SubPhase==='x15'?35:abuelita2SubPhase==='x125'?28:18) : (geno() ? 25 : crazy() ? 18 : 12))));
        bullets.splice(i, 1);
    }
}
}
}
}

// ══════════════════════════════════════════════════════════════
function render(){ updateTrailCanvas(); renderBullets(); }
function renderGeno(){ updateTrailCanvas(); renderBullets(); }

function updateTrailCanvas() {
let tc = document.getElementById('trail-canvas');
if(!tc) return;
let arena = document.getElementById('arena');
if(tc.width !== arena.clientWidth || tc.height !== arena.clientHeight) {
    tc.width = arena.clientWidth;
    tc.height = arena.clientHeight;
}
let ctx = tc.getContext('2d');
ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
ctx.fillRect(0, 0, tc.width, tc.height);

for(let b of bullets) {
    if(b.type === 'aim-shot' && b.aimTime > 0) continue;
    if(b.isGreenHeart) continue;
    
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.arc(b.x + b.w/2, b.y + b.h/2, (b.w/2)*0.85, 0, Math.PI*2);
    ctx.fill();
}
}

function renderBullets(){
const heart=document.getElementById('heart');
heart.style.left=px+'px';heart.style.top=py+'px';
heart.style.opacity=(invincible&&Math.floor(invincTimer/80)%2===0)?'0.12':'1';
const arena=document.getElementById('arena');
arena.querySelectorAll('.shot-el').forEach(e=>e.remove());
for(let b of bullets){
let el=document.createElement('div');
el.className='shot shot-el';

if(b.isGreenHeart) {
    el.innerHTML = '💚';
    el.style.cssText = `left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px;font-size:16px;display:flex;align-items:center;justify-content:center;background:transparent;box-shadow:none;text-shadow:0 0 10px #00ff00;`;
}
else if(b.type==='ball'){
let d=b.r*2;
el.style.cssText=`left:${b.x}px;top:${b.y}px;width:${d}px;height:${d}px;`+
`background:${b.color};box-shadow:0 0 10px ${b.color};border-radius:50%;`;
}else{
let angle = b.type === 'aim-shot' ? b.angle : Math.atan2(b.vy,b.vx);
let degAngle = angle*180/Math.PI;
el.style.cssText=
`left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px;`+
`background:${b.color};`+
`box-shadow:0 0 8px ${b.color},inset 0 0 4px #fff;`+
`transform-origin:center center;`+
`transform:rotate(${degAngle}deg);`+
`border-radius:${Math.min(b.w,b.h)/2}px;`;

if(b.blink) {
    el.style.opacity = '0.35';
    el.style.boxShadow = `0 0 25px ${b.color}, inset 0 0 10px #fff`;
}
}
arena.appendChild(el);
}
}

function abuelitaLoop(ts){
if(!gameRunning||gamePhase!=='abuelita')return;
let dt=Math.min(ts-lastTs,80);lastTs=ts;animFrame++;
if(ytAbuelita&&ytAbuelita.getCurrentTime)abuelitaMusicTime=ytAbuelita.getCurrentTime();

abuelitaPhaseUpdate(abuelitaMusicTime);

if(barrelActive){
if(barrelRolling){
let diff=barrelTarget-barrelAngle;
if(Math.abs(diff)>1.5){
let step=barrelSpeed*(dt/16);
barrelAngle+=diff>0?step:-step;
}else{
barrelAngle=barrelTarget;
barrelRolling=false;
setTimeout(()=>{
if(barrelActive&&gameRunning&&gamePhase==='abuelita'){
barrelTarget=barrelAngle+(Math.random()>0.5?360:-360);
barrelSpeed=1.1+Math.random()*0.9;
barrelRolling=true;
}
},rand(2800,5200));
}
}else if(!barrelRolling&&barrelSpeed===0){
barrelAngle+=0.12*(dt/16);
}
document.getElementById('game').style.transform=`rotate(${barrelAngle}deg)`;
document.getElementById('game').classList.add('barrel-active');
}

movePlayer();handleHeal(dt);
if(abuelitaAttacksOn){
attackTimer-=dt;waveLockTimer-=dt;
if(attackTimer<=0&&waveLockTimer<=0){
spawnAbuelitaAttack();
attackTimer=abuelitaAttackInterval+rand(-100,100);
waveLockTimer=abuelitaAttackGap;
}
}
updateBullets(dt);updateBlasters(dt);
if(invincible){invincTimer-=dt;if(invincTimer<=0)invincible=false;}
renderGeno();
abuelitaLoopId=requestAnimationFrame(abuelitaLoop);
}

function spawnAbuelitaAttack(){
const pool=abuelitaSubPhase==='final'
?[patSniperBarrage,patChineloThrow,patSniperCross,patChineloRain,patSniperAim,patMixedAbuelita,patChineloSpin]
:[patSniperBarrage,patChineloThrow,patSniperAim,patChineloRain];
pool[Math.floor(Math.random()*pool.length)]();
if(playerHP<130&&Math.random()<0.18)patGreenHeart();
}

function patSniperBarrage(){
let count=abuelitaSubPhase==='final'?14:9;
let spd=abuelitaSubPhase==='final'?7.2:5.4;
for(let i=0;i<count;i++){
setTimeout(()=>{
if(!gameRunning)return;
let edge=Math.floor(Math.random()*4);
let x,y,vx,vy;
if(edge===0){x=rand(10,AW-10);y=-14;vx=0;vy=spd;}
else if(edge===1){x=AW+14;y=rand(10,AH-10);vx=-spd;vy=0;}
else if(edge===2){x=rand(10,AW-10);y=AH+14;vx=0;vy=-spd;}
else{x=-14;y=rand(10,AH-10);vx=spd;vy=0;}
let hcx=px+HW/2,hcy=py+HH/2;
let dx=hcx-x,dy=hcy-y,d=Math.sqrt(dx*dx+dy*dy)||1;
vx=vx*0.55+(dx/d)*spd*0.45;
vy=vy*0.55+(dy/d)*spd*0.45;
let b=mkShot(x,y,7,7,vx,vy,'#ffee00');
b.isSniper=true;
bullets.push(b);
},i*85);
}
}

function patChineloThrow(){
let count=abuelitaSubPhase==='final'?5:3;
let spd=abuelitaSubPhase==='final'?4.0:3.1;
for(let i=0;i<count;i++){
setTimeout(()=>{
if(!gameRunning)return;
let fromLeft=Math.random()>0.5;
let x=fromLeft?-45:AW+45;
let y=rand(30,AH-70);
let tx=px+rand(-40,40),ty=py+rand(-25,25);
let dx=tx-x,dy=ty-y,d=Math.sqrt(dx*dx+dy*dy)||1;
let b=mkShot(x,y,38,18,(dx/d)*spd,(dy/d)*spd,'#8B4513');
b.isChinelo=true;b.w=38;b.h=18;
bullets.push(b);
},i*300);
}
}

function patSniperCross(){
let hcx=px+HW/2,hcy=py+HH/2;
for(let i=-2;i<=2;i++){
if(i===0)continue;
let b1=mkShot(hcx+i*38,-18,6,6,0,6.8,'#ffcc00');b1.isSniper=true;bullets.push(b1);
let b2=mkShot(-18,hcy+i*28,6,6,6.8,0,'#ffcc00');b2.isSniper=true;bullets.push(b2);
}
}

function patChineloRain(){
for(let i=0;i<7;i++){
setTimeout(()=>{
if(!gameRunning)return;
let x=rand(15,AW-15);
let b=mkShot(x,-28,34,16,rand(-0.9,0.9),rand(2.4,3.6),'#A0522D');
b.isChinelo=true;b.w=34;b.h=16;
bullets.push(b);
},i*150);
}
}

function patSniperAim(){
let count=abuelitaSubPhase==='final'?11:7;
let spd=abuelitaSubPhase==='final'?6.8:5.0;
for(let i=0;i<count;i++){
setTimeout(()=>{
if(!gameRunning)return;
let edge=Math.floor(Math.random()*4);
let x,y;
if(edge===0){x=rand(8,AW-8);y=-18;}
else if(edge===1){x=AW+18;y=rand(8,AH-8);}
else if(edge===2){x=rand(8,AW-8);y=AH+18;}
else{x=-18;y=rand(8,AH-8);}
bullets.push(mkAimShot(x,y,9,9,spd,'#ffff00',480));
},i*95);
}
}

function patChineloSpin(){
let arms=8,spd=3.6;
for(let i=0;i<arms;i++){
let a=(Math.PI*2/arms)*i;
let b=mkShot(AW/2,AH/2,30,14,Math.cos(a)*spd,Math.sin(a)*spd,'#8B4513');
b.isChinelo=true;b.w=30;b.h=14;
bullets.push(b);
}
}

function patMixedAbuelita(){
patSniperBarrage();
setTimeout(()=>{if(gameRunning)patChineloThrow();},550);
}

// ABUELITA FASE 2
// ══════════════════════════════════════════════════════════════════════════
let abuelita2Started=false, abuelita2MusicTime=0, abuelita2SubPhase='none', abuelita2AttacksOn=false;
let abuelita2AttackInterval=1600, abuelita2AttackGap=1400;
let abuelita2LoopId=null;
let abuelita2PlaybackRate=1;
let abuelita2SmokeIv=null;

const ABUELITA2_LINES = [
'* A Abuelita cai de joelhos, ofegante... *',
'ABUELITA: Você... realmente ouviu tudo isso?',
'ABUELITA: Eu passei a vida inteira tentando proteger eles\nda dor que a música traz.',

'* Ela se levanta. Os olhos acendem de novo. *'
];

function startAbuelitaPhase2Battle(){
abuelita2Started=true;
gamePhase='abuelita2';
gameRunning=true;
abuelita2SubPhase='wait';
abuelita2AttacksOn=false;
abuelita2PlaybackRate=1;
maxHP=400;playerHP=400;updateHP();
healCharges=3;healCooldown=0;updateCharges();
bullets=[];blasters=[];clearBlasterDom();
attackTimer=99999;waveLockTimer=0;
invincible=false;
px=AW/2-7;py=AH/2-7;
AW=580;AH=340;
document.getElementById('arena').style.width='580px';
document.getElementById('arena').style.height='340px';
document.getElementById('arena').className='';
document.getElementById('boss-area').classList.remove('p4-arena');
const bi=document.getElementById('boss-img');
bi.src=ABUELITA_CALM;
bi.className='abuelita-sil';
bi.style.opacity='1';

bi.style.transform='';

ytAbuelita2.seekTo(0);ytAbuelita2.setVolume(85);ytAbuelita2.setPlaybackRate(1);ytAbuelita2.playVideo();
}else{
let iv=setInterval(()=>{
if(abuelita2Ready){
clearInterval(iv);
ytAbuelita2.seekTo(0);ytAbuelita2.setVolume(85);ytAbuelita2.setPlaybackRate(1);ytAbuelita2.playVideo();
}
},200);
}

setupKeys();
lastTs=performance.now();
abuelita2LoopId=requestAnimationFrame(abuelita2Loop);
}

function abuelita2Loop(ts){
if(!gameRunning||gamePhase!=='abuelita2')return;
let dt=Math.min(ts-lastTs,80);lastTs=ts;animFrame++;
if(ytAbuelita2&&ytAbuelita2.getCurrentTime){
abuelita2MusicTime=ytAbuelita2.getCurrentTime();
}

abuelita2PhaseUpdate(abuelita2MusicTime);

if(barrelActive){
if(barrelRolling){
let diff=barrelTarget-barrelAngle;
if(Math.abs(diff)>1.5){
let step=barrelSpeed*(dt/16);
barrelAngle+=diff>0?step:-step;
}else{
barrelAngle=barrelTarget;
barrelRolling=false;
setTimeout(()=>{
if(barrelActive&&gameRunning&&(gamePhase==='abuelita'||gamePhase==='abuelita2')){
barrelTarget=barrelAngle+(Math.random()>0.5?360:-360);
barrelSpeed=(abuelita2SubPhase==='x15'?1.8:1.3)+Math.random()*0.7;
barrelRolling=true;
}
},rand(2200,4500));
}
}else if(!barrelRolling&&barrelSpeed===0){
barrelAngle+=0.12*(dt/16);
}
document.getElementById('game').style.transform=`rotate(${barrelAngle}deg)`;
document.getElementById('game').classList.add('barrel-active');
}

movePlayer();handleHeal(dt);
if(abuelita2AttacksOn){
attackTimer-=dt;waveLockTimer-=dt;
if(attackTimer<=0&&waveLockTimer<=0){
spawnAbuelita2Attack();
attackTimer=abuelita2AttackInterval+rand(-100,100);
waveLockTimer=abuelita2AttackGap;
}
}
updateBullets(dt);updateBlasters(dt);
if(invincible){invincTimer-=dt;if(invincTimer<=0)invincible=false;}
renderGeno();
abuelita2LoopId=requestAnimationFrame(abuelita2Loop);
}

function setAbuelita2Rate(rate){
if(abuelita2PlaybackRate===rate)return;
abuelita2PlaybackRate=rate;
if(ytAbuelita2&&ytAbuelita2.setPlaybackRate)ytAbuelita2.setPlaybackRate(rate);
}

function abuelita2PhaseUpdate(t){
const bi=document.getElementById('boss-img');

if(t>=5 && abuelita2SubPhase==='wait'){
abuelita2SubPhase='sil-attack';
abuelita2AttacksOn=true;
attackTimer=0;
abuelita2AttackInterval=1500;
abuelita2AttackGap=1300;
bi.className='abuelita-sil';
}

if(t>=25 && abuelita2SubPhase==='sil-attack'){
abuelita2SubPhase='revealed-slow';
bi.classList.remove('abuelita-sil');
bi.classList.add('abuelita-revealed');
bi.src=ABUELITA_CALM;
sndTransform();
attackTimer=0;
abuelita2AttackInterval=2100;
abuelita2AttackGap=1800;
}

if(t>=45 && abuelita2SubPhase==='revealed-slow'){
abuelita2SubPhase='fast';

attackTimer=0;

}

if(t>=86 && abuelita2SubPhase==='fast'){

}

if(t>=88 && abuelita2SubPhase==='pause'){
abuelita2SubPhase='normal2';

abuelita2AttackGap=1250;

if(t>=108 && abuelita2SubPhase==='normal2'){

attackTimer=0;
abuelita2AttackInterval=850;
abuelita2AttackGap=700;
maxHP=450;playerHP=450;updateHP();
healCharges=3;healCooldown=0;updateCharges();
sndHeal();
// Arena grande (NÃO fullscreen)
AW=900;AH=520;
document.getElementById('arena').style.width='900px';
document.getElementById('arena').style.height='520px';
document.getElementById('arena').className='geno-ultra-arena';
document.getElementById('boss-area').classList.add('p4-arena');
barrelActive=true;
barrelRolling=true;
barrelTarget=barrelAngle+360;
barrelSpeed=1.4;
sndTransform();
bigShakeScreen();
}

if(t>=119 && abuelita2SubPhase==='x125'){
abuelita2SubPhase='x15';
setAbuelita2Rate(1.5);
attackTimer=0;
abuelita2AttackInterval=600;
abuelita2AttackGap=500;
barrelActive=true;
barrelRolling=true;
barrelTarget=barrelAngle+720;
barrelSpeed=2.1;

// Arena MUITO GRANDE, mas NÃO fullscreen / fixed
AW=900;AH=520;
document.getElementById('arena').style.width='900px';
document.getElementById('arena').style.height='520px';
document.getElementById('arena').style.position='';
document.getElementById('arena').style.left='';
document.getElementById('arena').style.top='';
document.getElementById('arena').style.zIndex='';
document.getElementById('arena').style.margin='12px auto';
document.getElementById('arena').className='geno-ultra-arena';

if(abuelita2SmokeIv)clearInterval(abuelita2SmokeIv);
abuelita2SmokeIv=setInterval(()=>{
if(!gameRunning||abuelita2SubPhase!=='x15')return;
spawnAbuelitaSmoke();
},160);
bigShakeScreen();
}

if(t>=150 && abuelita2SubPhase==='x15'){
abuelita2SubPhase='slowdown';
setAbuelita2Rate(0.5);
attackTimer=0;
abuelita2AttackInterval=2800;
abuelita2AttackGap=2400;
bi.classList.remove('abuelita2-tremble','abuelita2-pulse');
barrelActive=false;barrelRolling=false;
document.getElementById('game').style.transition='transform 1.5s ease-out';
document.getElementById('game').style.transform='rotate(0deg)';
barrelAngle=0;
if(abuelita2SmokeIv){clearInterval(abuelita2SmokeIv);abuelita2SmokeIv=null;}
restoreAbuelita2ArenaLayout();
}

if(t>=154 && abuelita2SubPhase==='slowdown'){
abuelita2SubPhase='final-stop';
abuelita2AttacksOn=false;
bullets=[];clearBlasterDom();blasters=[];
setAbuelita2Rate(1);
if(ytAbuelita2)ytAbuelita2.pauseVideo();
setTimeout(()=>{
abuelita2DustFade();
},5000);
}
}

setTimeout(()=>{

function spawnAbuelita2Attack(){
if(abuelita2SubPhase==='sil-attack'){
patA2SniperShadow();
}else if(abuelita2SubPhase==='revealed-slow'){
patA2ChineloArc();
}else if(abuelita2SubPhase==='fast'){
patA2DoublePressure();
}else if(abuelita2SubPhase==='normal2'){
patA2WaveOfSilence();
}else if(abuelita2SubPhase==='x125'){
patA2TremblingStorm();
}else if(abuelita2SubPhase==='x15'){
patA2Inferno();
}else if(abuelita2SubPhase==='slowdown'){
patA2LastWhispers();
}else{
patSniperBarrage();
}
if(playerHP<150&&Math.random()<0.15)patGreenHeart();
}

function patA2SniperShadow(){
let count=8;
for(let i=0;i<count;i++){
setTimeout(()=>{
if(!gameRunning)return;
let edge=Math.floor(Math.random()*4);
let x,y;
if(edge===0){x=rand(20,AW-20);y=-16;}
else if(edge===1){x=AW+16;y=rand(20,AH-20);}
else if(edge===2){x=rand(20,AW-20);y=AH+16;}
else{x=-16;y=rand(20,AH-20);}
let b=mkAimShot(x,y,9,9,4.8,'#aaaaff',700);
b.isSniper=true;
bullets.push(b);
},i*140);
}
}

function patA2ChineloArc(){
let count=4;
for(let i=0;i<count;i++){
setTimeout(()=>{
if(!gameRunning)return;
let fromLeft=i%2===0;
let x=fromLeft?-50:AW+50;
let y=rand(AH*0.3,AH*0.6);
let b=mkShot(x,y,40,18,fromLeft?2.8:-2.8,-3.2,'#8B4513');
b.isChinelo=true;b.w=40;b.h=18;
b.vy=-3.2;
bullets.push(b);
setTimeout(()=>{if(b)b.vy+=0.15;},100);
},i*380);
}
}

function patA2DoublePressure(){
patSniperBarrage();
setTimeout(()=>{if(gameRunning)patChineloThrow();},280);
}

function patA2WaveOfSilence(){
let gapY=clamp(py+rand(-40,40),50,AH-50);
for(let y=0;y<AH;y+=22){
if(Math.abs(y-gapY)<48)continue;
let b=mkShot(-18,y,14,9,2.1,0,'#88ccff');
bullets.push(b);
}
setTimeout(()=>{
if(!gameRunning)return;
let gapX=clamp(px+rand(-40,40),50,AW-50);
for(let x=0;x<AW;x+=22){
if(Math.abs(x-gapX)<48)continue;
let b=mkShot(x,-18,9,14,0,2.1,'#ffaa88');
bullets.push(b);
}
},600);
}

function patA2TremblingStorm(){
patChineloSpin();
setTimeout(()=>{if(gameRunning)patSniperAim();},200);
setTimeout(()=>{if(gameRunning)patSniperBarrage();},450);
}

function patA2Inferno(){
for(let i=0;i<3;i++){
setTimeout(()=>{if(gameRunning)patChineloThrow();},i*180);
}
setTimeout(()=>{if(gameRunning)patSniperBarrage();},200);
setTimeout(()=>{if(gameRunning)patChineloSpin();},500);
}

function patA2LastWhispers(){
let b=mkShot(rand(30,AW-30),-20,12,12,rand(-0.4,0.4),1.6,'#ccccff');
bullets.push(b);
setTimeout(()=>{
if(!gameRunning)return;
let c=mkShot(rand(30,AW-30),AH+20,36,16,rand(-0.3,0.3),-1.5,'#8B4513');
c.isChinelo=true;c.w=36;c.h=16;
bullets.push(c);
},900);
}
